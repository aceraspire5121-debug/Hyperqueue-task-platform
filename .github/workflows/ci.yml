name: HyperQueue Platform CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Automated Integration Testing & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: 🧪 Run Backend Automated Jest Test Suite
        run: |
          cd backend
          npm test

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: 🏗️ Verify Frontend Build Compilation
        run: |
          cd frontend
          npm run build
